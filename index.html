<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Rekapitulasi & Kalkulator Data Market</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        select { padding: 10px; font-size: 16px; margin-bottom: 20px; width: 100%; max-width: 300px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #3498db; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h1>Data Market Harian</h1>
    
    <label for="marketSelect"><strong>Pilih Market:</strong></label><br>
    <select id="marketSelect" onchange="loadMarketData()">
        <option value="oregon-3">Oregon 3 (1:00 PM)</option>
        <option value="oregon-6">Oregon 6 (4:00 PM)</option>
        <option value="oregon-9">Oregon 9 (7:00 PM)</option>
        <option value="oregon-12">Oregon 12 (10:00 PM)</option>
        <option value="new-york-midday">New York Midday</option>
        <option value="new-york-evening">New York Evening</option>
        <option value="north-carolina-day">North Carolina Day</option>
        <option value="north-carolina-evening">North Carolina Evening</option>
        <option value="california-daily-4">California Daily 4</option>
        <option value="kentucky-pick-4">Kentucky Pick 4</option>
        <option value="macau-13">Macau 13:00</option>
        <option value="macau-16">Macau 16:00</option>
        <option value="macau-19">Macau 19:00</option>
    </select>

    <table id="dataTable">
        <thead>
            <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Nomor</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data akan dimuat otomatis di sini -->
        </tbody>
    </table>
</div>

<script>
    async function loadMarketData() {
        const market = document.getElementById('marketSelect').value;
        const tableBody = document.querySelector('#dataTable tbody');
        tableBody.innerHTML = '<tr><td colspan="3">Memuat data...</td></tr>';

        try {
            const response = await fetch(`data_market/${market}.json`);
            if (!response.ok) {
                throw new Error('File data belum tersedia (404).');
            }
            let data = await response.json();
            
            tableBody.innerHTML = '';
            if (!data || data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="3">Tidak ada data tersedia.</td></tr>';
                return;
            }

            // Membalik urutan agar tanggal terbaru muncul di baris paling atas
            data.reverse();

            data.forEach((item, index) => {
                // PERBAIKAN: Menggunakan fallback untuk menangani key lama yang pakai spasi
                const tanggal = item.tanggal || item["tanggal "] || "Tidak ada tanggal";
                const nomor = item.nomor || item["nomor "] || "Tidak ada nomor";

                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${tanggal.trim()}</td>
                    <td><strong>${nomor.trim()}</strong></td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        } catch (error) {
            tableBody.innerHTML = `<tr><td colspan="3" style="color: red;">Gagal memuat data: ${market}.json belum terbentuk atau nama file tidak cocok.</td></tr>`;
        }
    }

    window.onload = loadMarketData;
</script>

</body>
</html>
