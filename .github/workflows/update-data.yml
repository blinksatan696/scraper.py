name: Auto Update Data Market

on:
  schedule:
    # Berjalan 2 kali sehari (jam 02:00 UTC dan 14:00 UTC)
    - cron: '0 2,14 * * *'
  workflow_dispatch: # Mengizinkan Anda menekan tombol "Run" secara manual

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    steps:
      # 1. Mengambil kode dari repositori Anda
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Menyiapkan bahasa Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Menginstal library yang dibutuhkan
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium

      # 4. Menjalankan skrip Scraper
      - name: Run Scraper
        run: python scraper.py

      # 5. Menyimpan (Commit) file JSON yang baru dibuat ke GitHub
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data_market/ || true
          
          # Hanya commit jika ada perubahan data
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data market harian" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
